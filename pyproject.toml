[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perdoc-mining"
version = "0.2.0"
description = "Persian document mining, OCR, and PDF metadata extraction pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Danial Pahlavan", email = "danialpahlavan@gmail.com" },
]
dependencies = [
    "pypdf>=4.0.0",
    "pdf2image>=1.17.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
